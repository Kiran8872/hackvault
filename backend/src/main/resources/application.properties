spring.application.name=hackvault

# Local default profile uses H2 for easy setup.
spring.datasource.url=${DB_URL:jdbc:h2:mem:hackvault;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Supabase/PostgreSQL usage (recommended via env vars):
# DB_URL=jdbc:postgresql://db.odupxuknolmbzibmxvvi.supabase.co:5432/postgres?sslmode=require
# DB_USERNAME=postgres
# DB_PASSWORD=<your-password>

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Business config
hackvault.vote.moderator-weight=${MODERATOR_VOTE_WEIGHT:2}

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
